# Per-machine YASB config.
#
#   copy yasb\machine.example.yaml yasb\machine.yaml
#
# then tweak machine.yaml for this PC. machine.yaml is git-ignored, so each
# machine keeps its own. build.ps1 joins base.yaml + machine.yaml +
# widgets.yaml into config.yaml.
#
# This example is the personal PC's layout. On the work laptop:
#   - primary-bar screens:  - "140WQ2\n"  and  - 'OMEN 25i'
#   - comment out libre_cpu / libre_gpu (their sensor IDs are the PC's)
#   - home label:  <span>jokj</span>
#
# Widget names come from widgets.yaml (shared). Machine-only widgets go at
# the bottom of this file, under `widgets:`.
bars:
  primary-bar:
    enabled: true
    screens:
    - 'OMEN 25i'
    - '24G2W1G3-'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: false
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 32
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - home
      - line
      - glazewm_workspaces
      - line
      - taskbar
      center:
      - line
      - clock
      - line
      right:
      - audio_visualizer
      - media
      - pomodoro
      - notes
      - line
      - claude_usage
      - line
      - traffic
      - libre_cpu
      - libre_gpu
      - battery
      - line
      - control_center
  # Slimmer bar for the 1080px-wide vertical monitor
  vertical-bar:
    enabled: true
    screens:
    - '27G2G5'
    class_name: "yasb-bar vertical-bar"
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: false
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 32
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - home
      - line
      - glazewm_workspaces
      - line
      center:
      - line
      - clock
      - line
      right:
      - libre_cpu
      - libre_gpu
      - line
      - taskbar
      - line
      - control_center

# Machine-only widgets. Shared ones live in widgets.yaml.
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      direction: down
      label: "<span>kyuro</span>"
      menu_list:
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      system_menu: true
      power_menu: false
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: 0
