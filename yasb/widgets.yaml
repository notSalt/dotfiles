# Shared: widget definitions used by both machines.
# There's no `widgets:` header here on purpose: these entries continue the
# `widgets:` section that machine.yaml opens, so keep the 2-space indent.
# Don't define a widget here that machine.yaml also defines (duplicate key).
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a, %d %b %H:%M}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{level}"
      tooltip: true
      icons:
        "muted": "\uf026" # Icon for muted
        "10": "\uf026"  # Icon for 0-10% volume
        "30": "\uf026"  # Icon for 11-30% volume
        "60": "\uf026"  # Icon for 31-60% volume
        "100": "\uf026" # Icon for 61-100% volume
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: true
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uf107"
          toggle_up: "\uf106"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\ueb9a</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\ueaf8</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: true
        direction: down
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '{win[title]}'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: true
  line:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\u007c"
      label_alt: "\u007c"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: ""
      label_zero_index: false
      hide_empty_workspaces: true
      hide_if_offline: false
      toggle_workspace_layer:
        enabled: false
        tiling_label: "Tiling"
        floating_label: "Floating"
      app_icons: 
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{layout_name}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'next_layout'
        on_right: 'prev_layout'
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "Offline"
      hide_if_offline: false
      monitor_exclusive: true
      enable_scroll_switching: true
      app_icons: 
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\udb80\udd43"
      label_expanded: "\udb80\udd40"
      label_position: "left" # Can be "left" or "right"
      icon_size: 16 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_in_popup: true
      show_volume: false
      use_hook: true
      icons_per_row: 3
      show_network: false
      hide_icons: [] # Optional, list of process names to hide (e.g. ["discord"])
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\udb83\ude09</span>"
      change_automatically: false
    # Example path to folder with images. Can be a single string or a list of strings.
      image_path: "D:\\OneDrive\\Pictures\\Wallpapers\\Themes\\Monochrome" 
      engine:
        enabled: true
        animation: "circle" # circle/slide_top/diamond/split
      gallery:
        image_width: 300
        image_corner_radius: 0
        type: "magnified" # default/magnified/strip/slide - see "Gallery types" below
        orientation: "portrait" # landscape/portrait
        accent_color: "auto"
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
      keybindings:
        - keys: "ctrl+alt+w"
          action: "toggle_gallery"
          screen: "primary" # active/cursor/primary
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}{s}{artist}"
      label_alt: "{title}{s}{artist}"
      separator: " - "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      max_field_size:
        label: 45
        label_alt: 30
      show_thumbnail: false
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 0
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 50
        show_source: true
      media_menu_icons:
        play: "\udb81\udc0a"
        pause: "\udb80\udfe4"
        prev_track: "\udb81\udcae"
        next_track: "\udb81\udcad"
      scrolling_label:
        enabled: false
        update_interval_ms: 33
        style: "left"  # can be "left", "right", "bounce", "bounce-ease"
        separator: " | "
        label_padding: 0
        always_scroll: false
      # Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
      progress_bar:
        enabled: false       # Whether to enable the progress bar on the widget.
        alignment: "bottom"  # The alignment of the progress bar inside the widget container. Can be "top", "bottom", or "center".
  language:
    type: "yasb.language.LanguageWidget"
    options:
      label: "{lang[language_code]}"
      label_alt: "{lang[full_name]}"
      update_interval: 1
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      language_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icon: true
        layout_icon: "\udb80\udf0c"
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: "<span>\uf002</span>"
      search_placeholder: "Search applications..."
      max_results: 30
      show_icons: true
      icon_size: 32
      popup:
        width: 650
        height: 400
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        dark_mode: true
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+space"
          action: "toggle_quick_launch"
          screen: "primary"
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 0
      tooltip: true
      show_only_visible: true
      strict_filtering: true
      monitor_exclusive: true
      animation:
        enabled: true
        duration: 200
      preview:
        enabled: true
        width: 320
        delay: 400
        padding: 8
        margin: 8
        blur: true
      title_label:
        enabled: true
        show: "always"
        min_length: 0
        max_length: 30
      ignore_apps:
        processes: []
        titles: []
        classes: []
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf2db</span>{info[percent][total]}%"
      label_alt: "<span>\uf2db</span>{info[freq][current]} MHz"
      update_interval: 2000
      hide_decimal: true
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_menu"
      menu:
        enabled: true
        direction: "down"
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        round_corners: true
        border_color: None
        blur: true
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>{percent}%"
      label_alt: "<span>{icon}</span>{percent}% | {time_remaining}"
      update_interval: 5000
      time_remaining_natural: true
      hide_unsupported: true
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: true
        blink_interval: 500
      status_thresholds:
        critical: 10
        low: 25
        medium: 75
        high: 95
        full: 100
      status_icons:
        icon_charging: ""
        icon_critical: ""
        icon_low: ""
        icon_medium: ""
        icon_high: ""
        icon_full: ""
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span>{virtual_mem_percent}%"
      label_alt: "<span>\uefc5</span>{virtual_mem_used}/{virtual_mem_total}"
      update_interval: 5000
      callbacks:
        on_left: "toggle_menu"
      memory_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      menu:
        enabled: true
        direction: "down"
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        round_corners: true
        border_color: None
        blur: true
  # Libre Hardware Monitor (needs LHM running with Options > Remote Web Server > Run)
  # Sensor IDs: http://localhost:8085/data.json
  libre_cpu:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      class_name: "libre-monitor-widget libre-cpu"
      label: "<span></span>{info[value]}{info[unit]}"
      label_alt: "<span></span>{info[min]}/{info[max]}{info[unit]}"
      sensor_id: "/amdcpu/0/temperature/2"  # Core (Tctl/Tdie)
      update_interval: 2000
      precision: 0
      history_size: 60
      sensor_id_error_label: "N/A"
      connection_error_label: "Offline"
      server_host: "localhost"
      server_port: 8085
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec schtasks /run /tn LibreHardwareMonitor"  # start LHM if it's off
      libre_menu: &libre_menu
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        header_label: "Hardware"
        precision: 0
        columns: 1
        sensors:
          - id: "/amdcpu/0/temperature/2"
            name: "CPU Temp"
          - id: "/amdcpu/0/load/0"
            name: "CPU Load"
          - id: "/gpu-nvidia/0/temperature/0"
            name: "GPU Temp"
          - id: "/gpu-nvidia/0/temperature/2"
            name: "GPU Hot Spot"
          - id: "/gpu-nvidia/0/load/0"
            name: "GPU Load"
  libre_gpu:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      class_name: "libre-monitor-widget libre-gpu"
      label: "<span>󰢮</span>{info[value]}{info[unit]}"
      label_alt: "<span>󰢮</span>{info[min]}/{info[max]}{info[unit]}"
      sensor_id: "/gpu-nvidia/0/temperature/0"  # GPU Core
      update_interval: 2000
      precision: 0
      history_size: 60
      sensor_id_error_label: "N/A"
      connection_error_label: "Offline"
      server_host: "localhost"
      server_port: 8085
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec schtasks /run /tn LibreHardwareMonitor"  # start LHM if it's off
      libre_menu: *libre_menu
  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span class=\"icon down\"></span>{download_speed}<span class=\"icon up\"></span>{upload_speed}"
      label_alt: "<span class=\"icon down\"></span>{today_downloaded}<span class=\"icon up\"></span>{today_uploaded}"
      update_interval: 1000
      speed_unit: "bytes"
      hide_decimal: true
      speed_threshold:
        min_upload: 1000
        min_download: 1000
      callbacks:
        on_left: "toggle_menu"
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_interface_name: true
        show_internet_info: true
  systeminfo-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "systeminfo-grouper"
      widgets: [
        "memory",
        "cpu",
      ]
      collapse_options:
        enabled: true
        expanded_label: "\uf054"
        collapsed_label: "\ueaf8"
        label_position: "right"
  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\ueaf8</span>"
      tooltip: true
      sections_order:
        - "system_controls"
        - "quick_actions"
        - "sliders"
        - "power"
        - "media"
      popup:
        alignment: "right"
        direction: "down"
        border_color: none
        round_corners: true
        blur: true
        round_corners_type: normal
        offset_top: 8
        offset_left: 6
      sections:
        system_controls:
          profile_image_size: 28
          power_icon: "\uE7E8"
          lock_icon: "\uE72E"
          settings_icon: "\uE713"
        quick_actions:
          show: true
          columns: 3
          label_position: "default"
          actions:
            - id: "toggle_dnd"
              label: "Do Not Disturb"
              icon: "\uf285"
            - id: "toggle_mute"
              label: "Mute"
              icon: "\ue74f"
            - id: "toggle_mic_mute"
              label: "Mic Mute"
              icon: "\uF12E"
            - id: "screenshot"
              label: "Screenshot"
              icon: "\ue91b"
            - id: "touch_keyboard"
              label: "Keyboard"
              icon: "\uE765"
            - id: "toggle_theme"
              label: "Dark Mode"
              icon: "\uE708"
        sliders:
          show: true
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\ue622"
            next_track: "\ue623"
            play: "\uf5b0"
            pause: "\ue62e"
        power:
          show: true
          power_plan_title: "Power Plan"
          power_mode_title: "Power Mode"
          button_menu_icon: "\ue76c"
      callbacks:
        on_left: "toggle_menu"
  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      style: dots
      height: 12
      smoothness: 80
      sensitivity: 90
      auto_gain: true
      framerate: 60
      freq_min: 500
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 2000
      channels: stereo
      mono_option: average
      reverse: false
      mirror: false
      bars:
        count: 10
        width: 2
        gap: 4
      waves:
        width: 80
      dots:
        count: 16
        size: 2
        gap: 2
  # Reads the Claude Code OAuth token from ~/.claude/.credentials.json (no API key needed)
  claude_usage:
    type: "yasb.claude_usage.ClaudeUsageWidget"
    options:
      label: "<span>\U000F0674</span>{five_hour}%<span>{stale}</span>"
      label_alt: "<span>\U000F0674</span>5h {five_hour}% · 7d {seven_day}%<span>{stale}</span>"
      update_interval: 60
      cache_ttl: 120
      five_hour_reset_format: "relative"
      seven_day_reset_format: "absolute"
      tooltip: true
      token_history:
        enabled: true
        default_period: "today"
        show_graph: true
        show_graph_grid: false
        show_models: true
        week_starts_on: "monday"
      status:
        enabled: true
        show_in_menu: true
      callbacks:
        on_left: "toggle_menu"
        on_middle: "refresh"
        on_right: "toggle_label"
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
  pomodoro:
    type: "yasb.pomodoro.PomodoroWidget"
    options:
      label: "<span>{icon}</span>{remaining}"
      label_alt: "<span>{icon}</span>{session}/{total_sessions} · {remaining}"
      work_duration: 25
      break_duration: 5
      long_break_duration: 15
      long_break_interval: 4
      auto_start_breaks: true
      auto_start_work: false
      sound_notification: true
      show_notification: true
      session_target: 0
      hide_on_break: false
      icons:
        work: ""
        break: ""
        paused: ""
      callbacks:
        on_left: "toggle_menu"
        on_middle: "reset_timer"
        on_right: "toggle_timer"
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        circle_size: 160
        circle_thickness: 8
        circle_background_color: "#3c3c3c"
        circle_work_progress_color: "#4cc2ff"
        circle_break_progress_color: "#4caf50"
  notes:
    type: "yasb.notes.NotesWidget"
    options:
      label: "<span></span>{count}"
      label_alt: "{count} notes"
      enter_to_add_note: true
      paste_plain_text: true
      icons:
        note: ""
        delete: ""
        copy: ""
        float_on: ""   # OpenInNewWindow (pop out)
        float_off: ""  # BackToWindow
        close: ""
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_date_time: true
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
