# Personal PC only: widgets whose settings differ per machine.
# Appended after widgets.yaml, so these entries continue its `widgets:` mapping (keep the 2-space indent).
  home:
    type: yasb.home.HomeWidget
    options:
      direction: down
      label: "<span>kyuro</span>"
      menu_list:
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      system_menu: true
      power_menu: false
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: 0
